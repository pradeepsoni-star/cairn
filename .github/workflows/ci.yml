name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Cairn reads the filesystem and opens files with the platform's own
    # handler, so "it passes on Linux" is not evidence that it works. All
    # three run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: pip install -e ".[docs,ai,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
