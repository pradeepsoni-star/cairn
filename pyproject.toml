[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairn-desk"
version = "0.1.0"
description = "Find anything on your computer, and never lose a commitment again. Local-first, offline, no account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cairn contributors" }]
keywords = ["search", "desktop", "productivity", "local-first", "full-text-search", "assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Office/Business",
]

# The core - index, search, commitments, brief, web UI - needs only these.
# Everything that reads a particular file format is an optional extra, so a
# minimal install stays small and nothing fails at import time.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
# Reading the formats most people actually have on disk.
docs = [
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "striprtf>=0.0.26",
]
# Optional cloud answering. Cairn works fully without any of this.
ai = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]
all = ["cairn-desk[docs,ai]"]

[project.urls]
Homepage = "https://github.com/pradeepsoni-hq/cairn"
Issues = "https://github.com/pradeepsoni-hq/cairn/issues"

[project.scripts]
cairn = "cairn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.hatch.build.targets.wheel.force-include]
"src/cairn/web" = "cairn/web"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length is handled by judgement, not a counter.
# B008: FastAPI's Body()/Query() defaults are the framework's own idiom.
# SIM905: a wrapped block of words reads better than a 70-item list literal.
ignore = ["E501", "B008", "SIM905"]
